<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Meta Navigation HUD</title>
<style>
:root{--fg:#fff;--accent:#5cff7a;--muted:#a8b0b8;--panel:#111;--warn:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body{display:grid;place-items:center}button,input{font:inherit}
#app{position:relative;width:min(100vw,600px);height:min(100vh,600px);background:#000;padding:28px 30px;overflow:hidden}
.hidden{display:none!important}
#setup{height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:44px;margin:0}.sub{font-size:19px;line-height:1.35;color:var(--muted);margin:0}
input{width:100%;font-size:23px;padding:16px;border:2px solid #555;border-radius:16px;background:#0c0c0c;color:#fff;outline:none}
button{border:0;border-radius:16px;padding:16px;font-weight:800;font-size:22px;background:#222;color:#fff}.primary{background:var(--accent);color:#000}
#nav{height:100%;display:flex;flex-direction:column}.topline{display:flex;align-items:flex-start;gap:20px;min-height:235px}
#arrow{width:150px;font-size:132px;line-height:1;text-align:center;color:var(--accent);font-weight:900}
.instruction{flex:1;padding-top:8px}#distance{font-size:52px;font-weight:900;line-height:1.05}#street{font-size:30px;font-weight:750;margin-top:14px;line-height:1.1;word-break:break-word}
#after{font-size:18px;color:var(--muted);margin-top:10px;min-height:24px}.routebar{height:8px;background:#26302a;border-radius:8px;overflow:hidden;margin:5px 0 25px}.routebar>div{height:100%;background:var(--accent);width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;font-size:17px;color:var(--muted)}.stat b{display:block;color:#fff;font-size:29px;margin-top:4px}.speed b{font-size:40px}
#status{position:absolute;top:12px;right:18px;color:var(--muted);font-size:14px}#notice{position:absolute;left:24px;right:24px;bottom:20px;padding:12px 14px;border-radius:12px;background:#161616;color:var(--warn);font-size:15px;text-align:center}
#exit{position:absolute;top:10px;left:14px;background:transparent;padding:8px;font-size:18px;color:#aaa}
@media(max-width:500px){#app{padding:25px 24px}#arrow{width:125px;font-size:110px}#distance{font-size:46px}#street{font-size:27px}}
</style>
</head>
<body><main id="app">
<div id="status">GPS off</div>
<section id="setup">
<h1>Navigation HUD</h1>
<p class="sub">Enter a destination. This version calculates a driving route and advances turn instructions using live GPS.</p>
<input id="destination" autocomplete="off" placeholder="Destination or address" />
<button id="start" class="primary">Start Navigation</button>
<button id="gps">Enable GPS</button>
<p class="sub" style="font-size:14px">Routing: OpenStreetMap geocoding + OSRM public routing. Internet connection required.</p>
</section>
<section id="nav" class="hidden">
<button id="exit">‹ End</button>
<div class="topline"><div id="arrow">↑</div><div class="instruction"><div id="distance">—</div><div id="street">Finding route…</div><div id="after"></div></div></div>
<div class="routebar"><div id="progress"></div></div>
<div class="stats"><div class="stat"><span>REMAINING</span><b id="remaining">—</b></div><div class="stat"><span>ETA</span><b id="eta">—</b></div><div class="stat"><span>TIME</span><b id="timeleft">—</b></div><div class="stat speed"><span>SPEED</span><b id="speed">—</b></div></div>
</section>
<div id="notice" class="hidden"></div>
</main>
<script>
const $=id=>document.getElementById(id);let watchId=null,pos=null,route=null,steps=[],stepIndex=0,dest=null,lastRouteAt=0,offRouteCount=0;
const R=6371000;const toRad=x=>x*Math.PI/180;
function hav(a,b){const dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function fmtDist(m){return m<160?Math.max(20,Math.round(m/10)*10)+' ft':m<1609?Math.max(.1,m/1609.344).toFixed(1)+' mi':(m/1609.344).toFixed(1)+' mi'}
function fmtRemain(m){return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function fmtTime(s){const m=Math.max(1,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m'}
function showNotice(t,ms=3500){$('notice').textContent=t;$('notice').classList.remove('hidden');clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>$('notice').classList.add('hidden'),ms)}
function maneuverArrow(step){const m=(step.maneuver&&step.maneuver.modifier)||'';const type=(step.maneuver&&step.maneuver.type)||'';if(type==='arrive')return '●';if(m.includes('uturn'))return '↶';if(m.includes('sharp right'))return '↱';if(m.includes('slight right'))return '↗';if(m.includes('right'))return '→';if(m.includes('sharp left'))return '↰';if(m.includes('slight left'))return '↖';if(m.includes('left'))return '←';return '↑'}
function stepLabel(s){if(!s)return 'Continue';if(s.maneuver?.type==='arrive')return 'Destination';return s.name||s.ref||'Continue'}
async function enableGPS(){if(!navigator.geolocation){showNotice('Location is not available on this device.');return}return new Promise((resolve,reject)=>{navigator.geolocation.getCurrentPosition(p=>{onPos(p);if(watchId===null)watchId=navigator.geolocation.watchPosition(onPos,onGeoErr,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});resolve(p)},e=>{onGeoErr(e);reject(e)},{enableHighAccuracy:true,timeout:12000})})}
function onGeoErr(){ $('status').textContent='GPS error';showNotice('Allow location access for this site in your phone/Meta settings.',5000)}
function onPos(p){pos={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy,speed:p.coords.speed};$('status').textContent='GPS ±'+Math.round(p.coords.accuracy)+'m';$('speed').textContent=p.coords.speed!=null?Math.max(0,Math.round(p.coords.speed*2.23694))+' mph':'—';if(route)updateNav()}
async function geocode(q){const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);const r=await fetch(u,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Geocoding failed');const j=await r.json();if(!j.length)throw Error('Destination not found');return{lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name}}
async function getRoute(){if(!pos||!dest)return;lastRouteAt=Date.now();$('street').textContent='Calculating route…';const u=`https://router.project-osrm.org/route/v1/driving/${pos.lon},${pos.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`;
const r=await fetch(u);if(!r.ok)throw Error('Routing failed');const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error('No driving route found');route=j.routes[0];steps=route.legs.flatMap(l=>l.steps);stepIndex=0;offRouteCount=0;updateNav(true)}
function updateNav(force=false){if(!pos||!steps.length)return;while(stepIndex<steps.length-1){const s=steps[stepIndex];const loc={lat:s.maneuver.location[1],lon:s.maneuver.location[0]};const d=hav(pos,loc);if(d<35&&stepIndex<steps.length-1)stepIndex++;else break}
const s=steps[stepIndex],next=steps[stepIndex+1];const loc={lat:s.maneuver.location[1],lon:s.maneuver.location[0]};const d=hav(pos,loc);$('arrow').textContent=maneuverArrow(s);$('distance').textContent=s.maneuver?.type==='depart'?fmtDist(Math.max(0,s.distance)):fmtDist(d);$('street').textContent=stepLabel(s);$('after').textContent=next&&next.maneuver?.type!=='arrive'?'Then '+maneuverArrow(next)+' '+stepLabel(next):'';
let rem=0,secs=0;for(let i=stepIndex;i<steps.length;i++){rem+=steps[i].distance||0;secs+=steps[i].duration||0}$('remaining').textContent=fmtRemain(rem);$('timeleft').textContent=fmtTime(secs);const eta=new Date(Date.now()+secs*1000);$('eta').textContent=eta.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('progress').style.width=Math.max(5,Math.min(100,(1-rem/Math.max(route.distance,1))*100))+'%';
const nearest=Math.min(...steps.slice(Math.max(0,stepIndex-1),Math.min(steps.length,stepIndex+4)).map(x=>hav(pos,{lat:x.maneuver.location[1],lon:x.maneuver.location[0]})));if(nearest>180)offRouteCount++;else offRouteCount=0;if(offRouteCount>=3&&Date.now()-lastRouteAt>15000){showNotice('Off route — recalculating…');getRoute().catch(()=>showNotice('Could not recalculate route.'))}}
async function startNav(){const q=$('destination').value.trim();if(!q){showNotice('Enter a destination first.');return}try{$('start').disabled=true;$('start').textContent='Starting…';if(!pos)await enableGPS();dest=await geocode(q);$('setup').classList.add('hidden');$('nav').classList.remove('hidden');await getRoute()}catch(e){$('setup').classList.remove('hidden');$('nav').classList.add('hidden');showNotice(e.message||'Could not start navigation.',5000)}finally{$('start').disabled=false;$('start').textContent='Start Navigation'}}
$('gps').onclick=()=>enableGPS().then(()=>showNotice('GPS enabled.')).catch(()=>{});$('start').onclick=startNav;$('destination').addEventListener('keydown',e=>{if(e.key==='Enter')startNav()});$('exit').onclick=()=>{route=null;steps=[];dest=null;$('nav').classList.add('hidden');$('setup').classList.remove('hidden')};
</script></body></html>
